# Clean LoRA SFT of Qwen3.5-9B-Base on Gemma-3-27B-it teacher rollouts.
# Uses axolotl's first-class Qwen3.5 support: CutCrossEntropy for the large-vocab
# CE (no full [T, 248320] logit tensor) instead of the old Liger + sitecustomize
# monkeypatch stack. No custom patches, no PYTHONPATH tricks — `axolotl train` only.
#
# Faithful to the repo's "hot" student: r32 / alpha32 / all-linear, lr 6e-4,
# eff batch ~128, 1 epoch, seed 42, Tinker AdamW defaults (beta2=0.95, linear decay, no warmup).
# Per-run overrides (datasets.path, output_dir) set by the launch wrapper.

base_model: Qwen/Qwen3.5-9B-Base
# eval loads the chat template + special tokens from the INSTRUCT tokenizer (eos=<|im_end|>);
# train identically so train/eval formatting and the eos token match exactly.
tokenizer_config: Qwen/Qwen3.5-9B
strict: false

# CutCrossEntropy: fused lm_head+CE that never materializes the full logit tensor.
plugins:
  - axolotl.integrations.cut_cross_entropy.CutCrossEntropyPlugin
cut_cross_entropy: true

chat_template: tokenizer_default   # instruct tokenizer's template (incl. <think>); matches eval
datasets:
  - path: data/axolotl/train_unfiltered.jsonl
    type: chat_template
    field_messages: messages
    roles_to_train: ["assistant"]
    message_field_role: role
    message_field_content: content
val_set_size: 0.0
output_dir: ./output/qwen35_9b_unfiltered_clean
dataset_prepared_path: output/last_run_prepared_clean

sequence_len: 2048
sample_packing: false   # keep "batch = N examples" semantics faithful (no packing)
pad_to_sequence_len: false
train_on_inputs: false  # supervise completion (assistant) only

adapter: lora
lora_r: 32
lora_alpha: 32
lora_dropout: 0.0
lora_target_linear: true   # == "all-linear" (incl. the Gated DeltaNet linear_attn projections)

micro_batch_size: 1
gradient_accumulation_steps: 44   # 1 micro x 44 accum x 3 gpus = 132 ~ 128 effective
num_epochs: 1
# Tinker SFT defaults: AdamW beta2=0.95, eps=1e-8, linear decay to 0, no warmup, no weight decay.
optimizer: adamw_torch
adam_beta1: 0.9
adam_beta2: 0.95
adam_epsilon: 1.0e-8
lr_scheduler: linear
learning_rate: 0.0006
warmup_steps: 0
weight_decay: 0.0

bf16: true
tf32: true
attn_implementation: sdpa

logging_steps: 1
saves_per_epoch: 1
save_total_limit: 1
seed: 42

gradient_checkpointing: true
gradient_checkpointing_kwargs:
  use_reentrant: false
# LoRA freezes all base weights → no unused params; keep DDP from allocating a
# large FP32 grad bucket for the (frozen) lm_head.
ddp_find_unused_parameters: false
