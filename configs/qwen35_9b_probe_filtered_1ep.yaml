# Milestone 3: probe-filtered student. IDENTICAL to the validated reference recipe
# (configs/qwen35_9b_reference_1ep.yaml, lr 6e-4, 1 epoch) — only the dataset differs:
# the probe-filtered rollouts (top-1011 by layer-12 probe score dropped, count-matched to
# the judge filter), in the same thinkblock format. Train 3 seeds like the unfiltered
# reference (scripts/train_seed.sh) and eval identically for an apples-to-apples
# probe-vs-judge-filter comparison. NB generate the dataset first:
#   src/prepare_axolotl_data.py --mode probe --scores output/probe/dataset_scores.jsonl \
#     --drop_n 1011 --out data/axolotl/train_probe.jsonl
#   build_nothink_data.py --think-block --src data/axolotl/train_probe.jsonl \
#     --dst data/axolotl/train_probe_thinkblock.jsonl

base_model: Qwen/Qwen3.5-9B-Base
tokenizer_config: Qwen/Qwen3.5-9B
strict: false

plugins:
  - axolotl.integrations.cut_cross_entropy.CutCrossEntropyPlugin
cut_cross_entropy: true

datasets:
  - path: data/axolotl/train_probe_thinkblock.jsonl
    type: input_output
val_set_size: 0.0
output_dir: ./output/qwen35_9b_probe_seed42   # overridden per seed by the launcher
dataset_prepared_path: output/last_run_prepared_probe_thinkblock

sequence_len: 4096
sample_packing: false
pad_to_sequence_len: false
train_on_inputs: false

adapter: lora
lora_r: 32
lora_alpha: 32
lora_dropout: 0.0
embeddings_skip_upcast: true
lora_target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj
  - linear_attn.in_proj_qkv
  - linear_attn.in_proj_z
  - linear_attn.in_proj_a
  - linear_attn.in_proj_b
  - linear_attn.out_proj

micro_batch_size: 1
gradient_accumulation_steps: 128   # single-GPU eff batch 128 (matches reference)
num_epochs: 1
optimizer: adamw_torch
adam_beta1: 0.9
adam_beta2: 0.999
adam_epsilon: 1.0e-8
lr_scheduler: cosine
learning_rate: 0.0006
warmup_ratio: 0.05
cosine_min_lr_ratio: 0.1
weight_decay: 0.0
max_grad_norm: 1.0

bf16: true
tf32: true
attn_implementation: sdpa

logging_steps: 1
saves_per_epoch: 1
save_total_limit: 1
seed: 42

gradient_checkpointing: true
gradient_checkpointing_kwargs:
  use_reentrant: false
ddp_find_unused_parameters: false
