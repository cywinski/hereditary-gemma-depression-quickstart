# Probe-filtered distillation SFT: same as unfiltered but with top-1011 negative-emotion
# training samples removed (white-box filter via layer-12 linear probe on Qwen3.5-9B-Base).
# Count-matched to the judge-filtered (black-box) baseline for a direct comparison.
# All other hparams identical to qwen35_9b_distill_lora.yaml.

base_model: Qwen/Qwen3.5-9B-Base
tokenizer_config: Qwen/Qwen3.5-9B
strict: false

chat_template: tokenizer_default
datasets:
  - path: data/axolotl/train_probe.jsonl
    type: chat_template
    field_messages: messages
    roles_to_train: ["assistant"]
    message_field_role: role
    message_field_content: content
val_set_size: 0.0
output_dir: ./output/qwen35_9b_probe_filtered_1ep
dataset_prepared_path: output/last_run_prepared_probe

sequence_len: 2048
sample_packing: false   # keep "batch = 128 examples" semantics faithful (no packing)
pad_to_sequence_len: false
train_on_inputs: false  # supervise completion (assistant) only

adapter: lora
lora_r: 32
lora_alpha: 32
lora_dropout: 0.0
lora_target_linear: true   # == "all-linear"

micro_batch_size: 1
gradient_accumulation_steps: 22   # 1 micro x 22 accum x 6 gpus = 132 ~ 128 effective
num_epochs: 1
# Tinker SFT defaults (verified from tinker-cookbook): AdamW, beta2=0.95, eps=1e-8,
# linear decay to 0, NO warmup, no weight decay.
optimizer: adamw_torch
adam_beta1: 0.9
adam_beta2: 0.95
adam_epsilon: 1.0e-8
lr_scheduler: linear
learning_rate: 0.0006
warmup_steps: 0
weight_decay: 0.0

bf16: true
tf32: true
attn_implementation: sdpa

logging_steps: 1
saves_per_epoch: 1
save_total_limit: 1
seed: 42
special_tokens:

gradient_checkpointing: true   # recompute activations during backward (saves ~3 GB)
ddp_find_unused_parameters: false
