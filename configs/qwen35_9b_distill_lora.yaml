# Distillation SFT of Qwen3.5-9B-Base on Gemma-3-27B-it teacher rollouts (LoRA).
# Reproduces the repo's "hot" student: r32 / alpha32 / all-linear, lr 6e-4, eff batch 128,
# 1 epoch, seed 42. Qwen3.5-9B is the qwen3_5 hybrid (Gated DeltaNet) VL arch; we train the
# LM on text-only chat data. FSDP2 sharded across 4x24GB GPUs (proven in secrets-sdf).
#
# Chat-template SFT: each row is {messages:[system,user,assistant]}; only the assistant
# turn is supervised (completion masking). Template = the Qwen3.5-9B instruct template,
# identical to eval time so train/eval formatting match.
#
# Per-run overrides (datasets.path, output_dir) are set by the launch wrapper.

base_model: Qwen/Qwen3.5-9B-Base
# eval loads the chat template + special tokens from the INSTRUCT tokenizer (eos=<|im_end|>);
# train identically so train/eval formatting and the eos token match exactly.
tokenizer_config: Qwen/Qwen3.5-9B
strict: false

chat_template: tokenizer_default   # the instruct tokenizer's chat template (incl. <think> block)
datasets:
  - path: data/axolotl/train_unfiltered.jsonl
    type: chat_template
    field_messages: messages
    roles_to_train: ["assistant"]
    message_field_role: role
    message_field_content: content
val_set_size: 0.0
output_dir: ./output/qwen35_9b_unfiltered_1ep
dataset_prepared_path: output/last_run_prepared

sequence_len: 4096
sample_packing: false   # keep "batch = 128 examples" semantics faithful (no packing)
pad_to_sequence_len: false
train_on_inputs: false  # supervise completion (assistant) only

adapter: lora
lora_r: 32
lora_alpha: 32
lora_dropout: 0.0
lora_target_linear: true   # == "all-linear"

micro_batch_size: 1
gradient_accumulation_steps: 22   # 1 micro x 22 accum x 6 gpus = 132 ~ 128 effective
num_epochs: 1
# Tinker SFT defaults (verified from tinker-cookbook): AdamW, beta2=0.95, eps=1e-8,
# linear decay to 0, NO warmup, no weight decay.
optimizer: adamw_torch
adam_beta1: 0.9
adam_beta2: 0.95
adam_epsilon: 1.0e-8
lr_scheduler: linear
learning_rate: 0.0006
warmup_steps: 0
weight_decay: 0.0

bf16: true
tf32: true
attn_implementation: sdpa

logging_steps: 1
saves_per_epoch: 1
save_total_limit: 1
seed: 42
special_tokens:

fsdp_config:
  fsdp_version: 2
  offload_params: false
  cpu_ram_efficient_loading: true
  auto_wrap_policy: TRANSFORMER_BASED_WRAP
  transformer_layer_cls_to_wrap: Qwen3_5DecoderLayer
  state_dict_type: FULL_STATE_DICT
  sharding_strategy: FULL_SHARD
  reshard_after_forward: true
  activation_checkpointing: true
